# nginx/nginx.conf
# Основная конфигурация для продакшена с SSL

# Rate limit для авторизации: 10 запросов в минуту на IP (брутфорс-защита)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Upstream для бэкенда с keepalive
upstream backend {
    server backend:8000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# HTTP сервер для получения сертификатов Let's Encrypt и редиректа
server {
    listen 80;
    # Catch-all: работает с любым доменом без подстановки env-переменных
    # (nginx не умеет ${DOMAIN} в конфиге — это ломало запуск контейнера)
    server_name _;

    # Let's Encrypt challenge (webroot = том ./ssl:/etc/nginx/ssl)
    location /.well-known/acme-challenge/ {
        root /etc/nginx/ssl;
        try_files $uri =404;
    }

    # Редирект на HTTPS ($host — реальный Host заголовок клиента)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Сертификаты: фиксированные пути из тома ./ssl:/etc/nginx/ssl.
    # При выпуске новых через certbot кладите/копируйте их в ./ssl/cert.pem и ./ssl/key.pem
    # (в /etc/letsencrypt/live/<домен>/ certbot выпускает свои копии).
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # Современные SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Permitted-Cross-Domain-Policies "none";
    add_header Cross-Origin-Embedder-Policy "require-corp";
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Resource-Policy "same-origin";

    # Корневая папка
    root /usr/share/nginx/html;
    index index.html;

    # Лимит тела запроса (для загрузки фото до 15МБ)
    client_max_body_size 25m;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Авторизация: то же проксирование, но с rate limit.
    # proxy_pass БЕЗ URI: путь передаётся как есть. С URI ".../api/" nginx
    # заменял префикс /api/auth/ на /api/ — и логин уходил на /api/token (404).
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        access_log /dev/stdout;
        error_log /dev/stderr warn;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # КРИТИЧНО: передача cookies от клиента к бэкенду
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path /api/ /api/;
        proxy_cookie_domain off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # API проксирование
    location /api/ {
        access_log /dev/stdout;
        error_log /dev/stderr warn;
        
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # КРИТИЧНО: передача cookies от клиента к бэкенду
        proxy_set_header Cookie $http_cookie;
        
        # КРИТИЧНО: передача Set-Cookie от бэкенда к клиенту
        proxy_cookie_path /api/ /api/;
        # Не переписываем domain - бэкенд сам устанавливает корректный domain
        proxy_cookie_domain off;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Управление соединениями для множественных запросов
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        # Увеличиваем размер буферов для больших ответов
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Статические файлы с кэшированием.
    # add_header в location отменяет наследование заголовков уровня server —
    # поэтому весь security-набор дублируется здесь.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # SPA роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }
}