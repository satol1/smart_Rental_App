# nginx/nginx.dev.conf
# Конфигурация для локальной разработки (только HTTP)

server {
    listen 80;
    server_name localhost;
    
    # Настройки для обработки высокой нагрузки
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    large_client_header_buffers 4 16k;

    # Корневая папка
    root /usr/share/nginx/html;
    index index.html;

    # API проксирование
    location /api/ {
        # Логи в stdout/stderr: контейнер работает non-root и не может писать в /var/log/nginx
        access_log /dev/stdout;
        error_log /dev/stderr warn;
        
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # КРИТИЧНО: передача cookies от клиента к бэкенду
        proxy_set_header Cookie $http_cookie;
        
        # КРИТИЧНО: передача Set-Cookie от бэкенда к клиенту
        # Nginx автоматически передает Set-Cookie, но нужно убедиться что path/domain корректны
        proxy_cookie_path /api/ /api/;
        # Для localhost не переписываем domain
        proxy_cookie_domain off;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Управление соединениями для множественных запросов
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        
        # Увеличиваем размер буферов для больших ответов
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Добавляем заголовки для отладки
        add_header X-Debug-Backend-Status $upstream_status always;
        add_header X-Debug-Request-ID $request_id always;
    }

    # SPA роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }
}