# S_PROJECT_DOCKER/docker-compose.yml
# Основная конфигурация для продакшена с SSL (без ограничений ресурсов)

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./db_backup:/backups
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
    # Порт 5432 НЕ публикуется наружу: доступ к БД только внутри compose-сети.
    # Бэкапы (scripts/backup_database.sh) работают через `docker compose exec db pg_dump`
    # и внешний порт не нужен. Для разового доступа с хоста используйте
    # `docker compose exec db psql ...` или SSH-туннель.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Без ограничений ресурсов для основной конфигурации

  # Redis: хранилище для rate limiting, token denylist, brute-force
  # счётчиков и кэша агрегатов дашборда. Опционален для приложения:
  # при недоступности бэкенд деградирует на in-memory хранилища.
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    # Порт 6379 НЕ публикуется наружу: доступ только внутри compose-сети
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Без ограничений ресурсов для основной конфигурации

  backend:
    build:
      context: ./RentalApp_FASTAPI
      dockerfile: Dockerfile.backend
    # Без bind-mount: код попадает в образ сборкой (см. Dockerfile.backend)
    volumes:
      - uploads_data:/app/uploads
    ports:
      # Только для локальной отладки с хоста; в прод API ходит через nginx по внутренней сети
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - DEFAULT_TELEGRAM_CHAT_ID=${DEFAULT_TELEGRAM_CHAT_ID}
      - DEBUG=${DEBUG}
      - YANDEX_EMAIL_SENDER=${YANDEX_EMAIL_SENDER}
      - YANDEX_SMTP_PASSWORD=${YANDEX_SMTP_PASSWORD}
      - DB_TYPE=${DB_TYPE}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
      - TZ=Europe/Astrakhan
      # Доверяем X-Forwarded-For только из docker-сети: иначе uvicorn видит всех
      # клиентов как один IP nginx-контейнера и лимиты/brute-force бьют по всем
      # пользователям суммарно. Для прод-сервера сузьте до адреса nginx-контейнера.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      # CORS-настройки из .env (раньше не пробрасывались и молча игнорировались)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - CORS_ALLOW_WILDCARD=${CORS_ALLOW_WILDCARD:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Без ограничений ресурсов для основной конфигурации
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Диагностические тесты
  diagnostics:
    build:
      context: ./RentalApp_FASTAPI
      dockerfile: Dockerfile.backend
    # Без bind-mount: код попадает в образ сборкой (см. Dockerfile.backend)
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - DEFAULT_TELEGRAM_CHAT_ID=${DEFAULT_TELEGRAM_CHAT_ID}
      - DEBUG=${DEBUG}
      - YANDEX_EMAIL_SENDER=${YANDEX_EMAIL_SENDER}
      - YANDEX_SMTP_PASSWORD=${YANDEX_SMTP_PASSWORD}
      - DB_TYPE=${DB_TYPE}
      - SECRET_KEY=${SECRET_KEY}
      - TZ=Europe/Astrakhan
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: python scripts/run_diagnostics.py
    profiles:
      - diagnostics
    # Без ограничений ресурсов для основной конфигурации
        
  frontend:
    build:
      context: ./rental-app-main
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./rental-app-main/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./letsencrypt:/etc/letsencrypt
      - ./ssl:/etc/nginx/ssl
      # Контейнер работает от пользователя nginx (uid 101): файлы сертификатов
      # в ./ssl и ./letsencrypt на хосте должны быть читаемы этим uid
    environment:
      - DOMAIN=${DOMAIN}
      - SSL_EMAIL=${SSL_EMAIL}
    depends_on:
      - backend
    restart: unless-stopped
    # Без ограничений ресурсов для основной конфигурации
    healthcheck:
      # 127.0.0.1, не localhost (иначе IPv6 ::1); прод-конфиг на :80 отвечает 301 на https — fallback на https
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || wget -qO- --no-check-certificate https://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Certbot для автоматического получения SSL сертификатов
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./ssl:/etc/nginx/ssl
    command: >
      sh -c "
        if [ -n '${DOMAIN:-}' ] && [ -n '${SSL_EMAIL:-}' ]; then
          echo 'Настройка SSL для домена: ${DOMAIN}';
          certbot certonly --webroot --webroot-path=/etc/nginx/ssl --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN};
        else
          echo 'Режим разработки - SSL не настраивается';
          tail -f /dev/null;
        fi
      "
    depends_on:
      - frontend
    profiles:
      - ssl
    restart: unless-stopped
    # Без ограничений ресурсов для основной конфигурации

  # Сервис для автоматических бэкапов (опциональный)
  db-backup:
    image: postgres:15-alpine
    volumes:
      - ./db_backup:/backups
      - uploads_data:/uploads:ro
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=db
      - PGPASSWORD=${POSTGRES_PASSWORD}
      # Раз в сутки; устаревшие бэкапы старше 14 дней удаляются
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    profiles:
      - backup
    depends_on:
      db:
        condition: service_healthy
    # Планировщик бэкапов (скрипт в scripts/backup_loop.sh): дамп БД + архив
    # uploads + ротация. Запуск: docker compose --profile backup up -d db-backup
    restart: unless-stopped
    command: ["sh", "/backup_loop.sh"]
    # Без ограничений ресурсов для основной конфигурации

volumes:
  postgres_data:
  redis_data:
  uploads_data: