# docker-compose.limited-resources.yml
# Конфигурация для имитации сервера с ограниченными ресурсами:
# CPU: 1 vCore (1 виртуальное ядро)
# RAM: 2 GB

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./db_backup:/backups
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
    # Порт 5432 НЕ публикуется наружу: доступ к БД только внутри compose-сети
    # (бэкапы через `docker compose exec db pg_dump` не требуют внешнего порта)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s  # Увеличено для экономии ресурсов
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.4'  # 40% от 1 vCore для базы данных
          memory: 512M  # 512 MB для PostgreSQL
        reservations:
          cpus: '0.2'  # Минимум 20% CPU
          memory: 256M  # Минимум 256 MB RAM
    # Оптимизация PostgreSQL для ограниченных ресурсов
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c max_parallel_maintenance_workers=1

  # Redis: хранилище для rate limiting, token denylist, brute-force
  # счётчиков и кэша агрегатов дашборда. Опционален для приложения:
  # при недоступности бэкенд деградирует на in-memory хранилища.
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    # Порт 6379 НЕ публикуется наружу: доступ только внутри compose-сети
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.15'  # 15% от 1 vCore для Redis
          memory: 128M  # 128 MB для Redis
        reservations:
          cpus: '0.05'  # Минимум 5% CPU
          memory: 64M  # Минимум 64 MB RAM

  backend:
    build:
      context: ./RentalApp_FASTAPI
      dockerfile: Dockerfile.backend
    # Без bind-mount: код попадает в образ сборкой (см. Dockerfile.backend)
    volumes:
      - uploads_data:/app/uploads
    ports:
      # Только для локальной отладки с хоста; в прод API ходит через nginx по внутренней сети
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - DEFAULT_TELEGRAM_CHAT_ID=${DEFAULT_TELEGRAM_CHAT_ID}
      - DEBUG=${DEBUG}
      - YANDEX_EMAIL_SENDER=${YANDEX_EMAIL_SENDER}
      - YANDEX_SMTP_PASSWORD=${YANDEX_SMTP_PASSWORD}
      - DB_TYPE=${DB_TYPE}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_ALLOW_WILDCARD=${CORS_ALLOW_WILDCARD}
      - TZ=Europe/Astrakhan
      # Доверяем X-Forwarded-For только из docker-сети (см. docker-compose.yml)
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      # Оптимизация для ограниченных ресурсов
      - WORKERS=1  # Один worker для экономии памяти
      - MAX_REQUESTS=1000  # Перезапуск worker после 1000 запросов
      - MAX_REQUESTS_JITTER=100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s  # увеличено для экономии ресурсов
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.4'  # 40% от 1 vCore для backend
          memory: 768M  # 768 MB для FastAPI приложения
        reservations:
          cpus: '0.2'  # Минимум 20% CPU
          memory: 384M  # Минимум 384 MB RAM

  # Диагностические тесты
  diagnostics:
    build:
      context: ./RentalApp_FASTAPI
      dockerfile: Dockerfile.backend
    # Без bind-mount: код попадает в образ сборкой (см. Dockerfile.backend)
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - DEFAULT_TELEGRAM_CHAT_ID=${DEFAULT_TELEGRAM_CHAT_ID}
      - DEBUG=${DEBUG}
      - YANDEX_EMAIL_SENDER=${YANDEX_EMAIL_SENDER}
      - YANDEX_SMTP_PASSWORD=${YANDEX_SMTP_PASSWORD}
      - DB_TYPE=${DB_TYPE}
      - SECRET_KEY=${SECRET_KEY}
      - TZ=Europe/Astrakhan
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: python scripts/run_diagnostics.py
    profiles:
      - diagnostics
    deploy:
      resources:
        limits:
          cpus: '0.1'  # 10% от 1 vCore для диагностики
          memory: 128M  # 128 MB для диагностических тестов
        reservations:
          cpus: '0.05'  # Минимум 5% CPU
          memory: 64M  # Минимум 64 MB RAM
        
  frontend:
    build:
      context: ./rental-app-main
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"  # Vite dev server порт для разработки
    volumes:
      - ./rental-app-main/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./letsencrypt:/etc/letsencrypt
      - ./ssl:/etc/nginx/ssl
    environment:
      - DOMAIN=localhost
      - SSL_EMAIL=
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, не localhost (иначе IPv6 ::1); http достаточно для dev-конфига
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || wget -qO- --no-check-certificate https://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.2'  # 20% от 1 vCore для nginx
          memory: 256M  # 256 MB для nginx
        reservations:
          cpus: '0.1'  # Минимум 10% CPU
          memory: 128M  # Минимум 128 MB RAM
    # Оптимизация nginx для ограниченных ресурсов будет применена через конфигурационный файл

  # Certbot для автоматического получения SSL сертификатов
  certbot:
    image: certbot/certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./ssl:/etc/nginx/ssl
    command: >
      sh -c "
        if [ -n '${DOMAIN:-}' ] && [ -n '${SSL_EMAIL:-}' ]; then
          echo 'Настройка SSL для домена: ${DOMAIN}';
          certbot certonly --webroot --webroot-path=/etc/nginx/ssl --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN};
        else
          echo 'Режим разработки - SSL не настраивается';
          tail -f /dev/null;
        fi
      "
    depends_on:
      - frontend
    profiles:
      - ssl
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.05'  # 5% от 1 vCore для certbot
          memory: 64M  # 64 MB для certbot
        reservations:
          cpus: '0.02'  # Минимум 2% CPU
          memory: 32M  # Минимум 32 MB RAM

  # Сервис для автоматических бэкапов (опциональный)
  db-backup:
    image: postgres:15-alpine
    volumes:
      - ./db_backup:/backups
      - uploads_data:/uploads:ro
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=db
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    profiles:
      - backup
    depends_on:
      db:
        condition: service_healthy
    # Планировщик бэкапов (scripts/backup_loop.sh): дамп БД + архив uploads + ротация
    restart: unless-stopped
    command: ["sh", "/backup_loop.sh"]
    deploy:
      resources:
        limits:
          cpus: '0.05'  # 5% от 1 vCore для бэкапов
          memory: 64M  # 64 MB для сервиса бэкапов
        reservations:
          cpus: '0.02'  # Минимум 2% CPU
          memory: 32M  # Минимум 32 MB RAM

volumes:
  postgres_data:
  redis_data:
  uploads_data:
