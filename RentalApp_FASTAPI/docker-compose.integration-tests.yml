# docker-compose.integration-tests.yml
# Конфигурация Docker Compose для запуска интеграционных тестов

networks:
  integration-test-network:
    driver: bridge

services:
  integration-test-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=integration_test_user
      - POSTGRES_PASSWORD=integration_test_password
      - POSTGRES_DB=integration_test_db
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
    # Порт наружу не публикуется: pytest ходит по внутренней сети compose
    # (публикация 543x на хосте приводила к конфликтам параллельных наборов)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_test_user -d integration_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # Используем tmpfs для быстрых тестов
    networks:
      - integration-test-network

  test-backend:
    # pip install пишется в системные site-packages: у appuser нет прав.
    # Тестовый контейнер — root допустим (прод-образ остаётся non-root).
    user: root
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://integration_test_user:integration_test_password@integration-test-db:5432/integration_test_db
      - TEST_DATABASE_URL=postgresql+asyncpg://integration_test_user:integration_test_password@integration-test-db:5432/integration_test_db
      - CSRF_SECRET_KEY=0123456789abcdef0123456789abcdef
      - SECRET_KEY=abcdef0123456789abcdef0123456789
      - DEBUG=true
      - TZ=Europe/Astrakhan
      - DISABLE_CSRF=true
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      integration-test-db:
        condition: service_healthy
    networks:
      - integration-test-network
    command: >
      sh -c "
        pip install -r requirements-test.txt &&
        echo 'Ожидание готовности БД...' &&
        sleep 10 &&
        echo 'Проверка подключения к БД...' &&
        python -c 'import asyncio; from sqlalchemy.ext.asyncio import create_async_engine; engine = create_async_engine(\"postgresql+asyncpg://integration_test_user:integration_test_password@integration-test-db:5432/integration_test_db\"); print(\"БД доступна\")' &&
        echo 'Создание тестовой базы данных...' &&
        python create_test_database.py &&
        echo 'Запуск integration тестов...' &&
        pytest tests/ -m integration -v --tb=short --cov=api --cov-report=term-missing
      "
