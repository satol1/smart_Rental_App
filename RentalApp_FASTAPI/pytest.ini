[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# tests/attic — устаревшие smoke-скрипты (дефолт pytest дополнен attic)
norecursedirs = .* build dist _darcs CVS *.egg node_modules venv attic
addopts = 
    -v
    --tb=short
    --strict-markers
    -m "not integration and not e2e and not slow"
    -W ignore::DeprecationWarning
markers =
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    unit: marks tests as unit tests
    slow: marks tests as slow running tests
    asyncio: marks tests as async tests
    auth: marks tests related to authentication
    equipment: marks tests related to equipment management
    rental: marks tests related to rental operations
    reservation: marks tests related to reservation operations
    financial: marks tests related to financial operations
    dashboard: marks tests related to dashboard functionality
    order: marks tests with specific execution order
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning