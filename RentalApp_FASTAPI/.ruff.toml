# RentalApp_FASTAPI/.ruff.toml
# Минимальный lint-конфиг для бэкенда (используется CI и pre-commit).
# TODO: по мере рефакторинга убирать правила из ignore — цель: только E501/I001/W29x
# до перехода на ruff format.

line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "W"]
ignore = [
    # --- Легаси-долг: не чинится массово, гасим чтобы CI был зелёным ---
    "E402",   # импорт не в начале файла (легаси-скрипты/инициализация)
    "E501",   # длина строки: много длинных URL/SQL, требует ruff format
    "E711",   # сравнение с None — легитимно в SQLAlchemy-фильтрах
    "E712",   # сравнение с True/False — легитимно в SQLAlchemy-фильтрах
    "E722",   # bare except (легаси)
    "F401",   # неиспользуемые импорты (легаси, чистить постепенно)
    "F403",   # 'from module import *' (легаси)
    "F541",   # f-строка без подстановок
    "F811",   # переопределение имени (легаси)
    "F821",   # undefined name — 10 известных мест в api/, чинит команда бэкенда
    "F823",   # local variable referenced before assignment (легаси)
    "F841",   # неиспользуемая локальная переменная (легаси)
    "I001",   # несортированные импорты — включить после перехода на ruff format
    "W291",   # trailing whitespace — территория ruff format
    "W292",   # нет newline в конце файла — территория ruff format
    "W293",   # whitespace на пустой строке — территория ruff format
]
