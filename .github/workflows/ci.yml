name: CI

on:
  push:
    branches: [main, "0*"]
  pull_request:
    branches: [main, "0*"]

permissions:
  contents: read

# Отменяем устаревшие прогоны того же PR/ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + unit + integration/e2e tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: RentalApp_FASTAPI
    services:
      # tests/api и tests/critical гоняют запросы через TestClient:
      # DIContainerMiddleware открывает реальную сессию — нужна живая PostgreSQL
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
      SECRET_KEY: ci-secret-key-for-tests-only-0123456789abcdef
      CSRF_SECRET_KEY: ci-csrf-secret-key-for-tests-only-0123456789abcd
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            RentalApp_FASTAPI/requirements.txt
            RentalApp_FASTAPI/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: python -m pytest tests -m "not integration and not e2e and not slow" -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db

      # Этап 5.2 аудита: integration + e2e тесты раньше гонялись только локально.
      # Выбираются только тесты с явными маркерами integration/e2e; три файла
      # без маркеров (database_only, race_condition, final_race_condition_fix)
      # покрываются юнит-шагом выше.
      # DISABLE_CSRF=true — фикстуры e2e постят логин без CSRF-заголовков
      # (тесты с проверкой реального CSRF живут в юнит-шаге: tests/api/test_csrf_protection.py)
      - name: Integration + e2e tests (pytest)
        run: python -m pytest tests/integration tests/e2e -q -o addopts="" -m "integration or e2e"
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          DISABLE_CSRF: "true"

      # Advisory: уязвимости зависимостей не блокируют сборку (шум от транзитивных пакетов),
      # но видны в логе
      - name: Dependency audit (pip-audit, advisory)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-test.txt --skip-editable
        continue-on-error: true

      # Контракт API: экспорт схемы из кода для проверки дрейфа типов фронта (job api-contract)
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py openapi.json

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-schema
          path: RentalApp_FASTAPI/openapi.json
          retention-days: 1

  api-contract:
    name: API contract (openapi-typescript drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend
    defaults:
      run:
        working-directory: rental-app-main
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download OpenAPI schema
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openapi-schema
          path: RentalApp_FASTAPI

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rental-app-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Регенерируем типы из свежей схемы и сверяем с закоммиченным файлом:
      # расхождение = кто-то поменял API/схемы бэка и не обновил src/types/api/schema.d.ts
      - name: Check types drift
        run: |
          npx openapi-typescript ../RentalApp_FASTAPI/openapi.json -o schema.check.d.ts
          if ! diff -u src/types/api/schema.d.ts schema.check.d.ts; then
            echo "::error::Дрейф контракта API: сгенерированные типы не совпадают с закоммиченными."
            echo "Обнови схему и типы: python RentalApp_FASTAPI/scripts/export_openapi.py && npm run gen:api (из rental-app-main)"
            exit 1
          fi
          echo "Контракт API синхронен."

  frontend:
    name: Frontend (eslint + build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rental-app-main
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rental-app-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Этап 5.3 аудита: eslint чист (0 ошибок/0 варнингов) — линт блокирующий
      - name: Lint (eslint)
        run: npx eslint src --max-warnings=0

      # Этап 5.1 аудита 2026-09-12: новые сервисы — только на сгенерированных типах API
      - name: API types usage check
        run: npm run check:api-types

      - name: Build (vite)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm run test:run

      - name: Dependency audit (npm audit, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  # Этап 5.5 аудита: браузерный smoke полного стека (vite dev + uvicorn + postgres)
  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://smoke:smoke@localhost:5433/smoke
      SECRET_KEY: ci-smoke-secret-key-for-tests-only-0123456789abcd
      CSRF_SECRET_KEY: ci-smoke-csrf-secret-key-for-tests-only-0123456789
      DEBUG: "true"
      TZ: Europe/Astrakhan
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RentalApp_FASTAPI/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rental-app-main/package-lock.json

      - name: Install backend dependencies
        working-directory: RentalApp_FASTAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create schema
        working-directory: RentalApp_FASTAPI
        run: |
          python -c "import asyncio
          from containers.constants import engine
          from api.database_models import Base
          import api.models
          async def main():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()
          asyncio.run(main())"

      - name: Seed smoke data
        working-directory: RentalApp_FASTAPI
        run: python scripts/seed_e2e_smoke.py

      - name: Start backend
        working-directory: RentalApp_FASTAPI
        run: |
          nohup python -m uvicorn api.main_api:app --port 8001 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8001/health && break || sleep 1
          done
          curl -sf http://localhost:8001/health

      - name: Run Playwright tests
        working-directory: rental-app-main
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts
          path: |
            rental-app-main/test-results/
            RentalApp_FASTAPI/uvicorn.log
          retention-days: 7
          if-no-files-found: ignore

  docker-build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Только для main, чтобы не гонять тяжёлые сборки на каждый push в рабочие ветки
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build -t rental-backend -f RentalApp_FASTAPI/Dockerfile.backend RentalApp_FASTAPI

      - name: Build frontend image
        run: docker build -t rental-frontend -f rental-app-main/Dockerfile.frontend rental-app-main
