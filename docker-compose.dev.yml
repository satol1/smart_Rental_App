# docker-compose.dev.yml
# Переопределения для локальной разработки (DEBUG=true, фронт на :5173, dev-nginx)
# Подключается только явно: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  frontend:
    ports:
      - "5173:80"  # Только HTTP для разработки
    volumes:
      - ./rental-app-main/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    environment:
      - DOMAIN=localhost
      - SSL_EMAIL=

  backend:
    environment:
      - DEBUG=true
      - TZ=Europe/Astrakhan
